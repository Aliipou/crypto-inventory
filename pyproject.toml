[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-inventory"
version = "0.1.0"
description = "Static scanner for quantum-vulnerable cryptography (RSA/ECC/DH) and Harvest-Now-Decrypt-Later risk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Pourrahim" }]
keywords = ["post-quantum", "pqc", "cryptography", "hndl", "migration", "scanner"]
dependencies = []

[project.scripts]
crypto-inventory = "crypto_inventory.cli:main"

[tool.setuptools]
packages = ["crypto_inventory"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Rule/manifest/cert data tables: one dense line per detection rule is the
# clearest form; wrapping the descriptive strings would hurt readability.
"crypto_inventory/rules.py" = ["E501"]
"crypto_inventory/rust_frontend.py" = ["E501"]
"crypto_inventory/manifests.py" = ["E501"]
"crypto_inventory/certs.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["crypto_inventory"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
